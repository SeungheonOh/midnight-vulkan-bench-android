[package]
name = "midnight-bench-core"
version = "0.2.0"
edition = "2024"
rust-version = "1.90.0"
description = "Android Vulkan vs CPU prover benchmark core for midnight-zk"
license = "Apache-2.0"
publish = false

[workspace]

[lib]
name = "midnight_bench_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
blake2b_simd = "1"
ff = "0.13"
group = "0.13"
libc = "0.2"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.10"
serde_json = "1"
midnight-curves = { git = "https://github.com/SeungheonOh/midnight-zk.git", rev = "15a9734fad6a97112b2fc2c4dd4788c698b1b609" }
midnight-proofs = { git = "https://github.com/SeungheonOh/midnight-zk.git", rev = "15a9734fad6a97112b2fc2c4dd4788c698b1b609", features = ["gpu", "circuit-params"] }
midnight-vulkan = { git = "https://github.com/SeungheonOh/midnight-zk.git", rev = "15a9734fad6a97112b2fc2c4dd4788c698b1b609" }
midnight-circuits = { git = "https://github.com/SeungheonOh/midnight-zk.git", rev = "15a9734fad6a97112b2fc2c4dd4788c698b1b609" }
midnight-zk-stdlib = { git = "https://github.com/SeungheonOh/midnight-zk.git", rev = "15a9734fad6a97112b2fc2c4dd4788c698b1b609" }
midnight-gpu-prover = { git = "https://github.com/SeungheonOh/midnight-zk.git", rev = "15a9734fad6a97112b2fc2c4dd4788c698b1b609" }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[patch.crates-io]
midnight-proofs = { git = "https://github.com/SeungheonOh/midnight-zk.git", rev = "15a9734fad6a97112b2fc2c4dd4788c698b1b609" }
midnight-curves = { git = "https://github.com/SeungheonOh/midnight-zk.git", rev = "15a9734fad6a97112b2fc2c4dd4788c698b1b609" }
midnight-circuits = { git = "https://github.com/SeungheonOh/midnight-zk.git", rev = "15a9734fad6a97112b2fc2c4dd4788c698b1b609" }

[profile.release]
opt-level = 3
debug = false
codegen-units = 1
panic = "unwind"
