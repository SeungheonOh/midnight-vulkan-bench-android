name: Build Distributable Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shader compilers (glslang + spirv-tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3
      - run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Rust 1.90.0 (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90.0"
          targets: aarch64-linux-android

      - name: Build signed arm64-v8a release APK
        run: ./scripts/build-apk.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: midnight-vulkan-bench-arm64-v8a
          path: |
            dist/*.apk
            dist/*.sha256
